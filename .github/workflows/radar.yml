name: mint-radar
on:
  schedule:
    # 北京时间 8:00–次日 1:50，每 10 分钟（GitHub 用 UTC；高峰时可能延迟几分钟）
    - cron: "*/10 0-17 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: scan
        env:
          ANKR_KEY: ${{ secrets.ANKR_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PTAH_WALLET: ${{ secrets.PTAH_WALLET }}
        run: python radar.py
      - name: save state
        run: |
          git config user.name radar-bot
          git config user.email radar-bot@users.noreply.github.com
          git add state.json
          git diff --cached --quiet || (git commit -m "state" -q && git push -q)
